<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Primavera Offline</title>

  <!-- MapLibre -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>

  <!-- Estilos -->
  <link rel="stylesheet" href="./styles.css"/>

  <!-- Favicon para evitar 404 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22>🗺️</text></svg>">
</head>
<body>
  <!-- Barra superior -->
  <div id="topbar">
    <button id="btn-locate">📍 Mi ubicación</button>
    <button id="btn-follow">🧭 Seguirme: OFF</button>
    <button id="btn-navigate">➡️ Navegar a salida</button>
    <span>Plus Code: <b id="pluscode">—</b></span>
    <span id="status" class="status">Listo</span>
  </div>

  <!-- Mapa -->
  <div id="map"></div>

  <!-- Guía (rumbo/distancia) -->
  <div id="guide" class="guide">—</div>

  <!-- Panel capas -->
  <div id="panel">
    <div class="panel-row">
      <button id="btn-zoom-all">🔍 Zoom a todas</button>
      <button id="btn-hide-all">Ocultar todas</button>
      <button id="btn-show-all">Mostrar todas</button>
    </div>
    <details open>
      <summary><strong>Capas de rutas</strong></summary>
      <div id="routes-list"></div>
    </details>
  </div>

  <!-- Librerías -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="./libs/openlocationcode.js"></script>
  <script src="./libs/pmtiles.js"></script>

  <!-- App -->
  <script src="./app.js"></script>

  <!-- Service Worker (activar en producción) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
