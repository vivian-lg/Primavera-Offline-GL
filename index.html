<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Primavera Offline</title>

  <!-- MapLibre -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>

  <!-- Estilos -->
  <link rel="stylesheet" href="./styles.css"/>

  <!-- Favicon para evitar 404 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22>🗺️</text></svg>">
</head>
<body>
  <!-- Barra superior -->
  <div id="topbar">
    <button id="btn-locate">📍 Mi ubicación</button>
    <button id="btn-follow">🧭 Seguirme: OFF</button>
    <button id="btn-navigate">➡️ Navegar a salida</button>
    <span>Plus Code: <b id="pluscode">—</b></span>
    <span id="status" class="status">Listo</span>
  </div>

  <!-- Mapa -->
  <div id="map"></div>

  <!-- Guía (rumbo/distancia) -->
  <div id="guide" class="guide">—</div>

  <!-- Panel capas -->
  <div id="panel">
    <div class="panel-row">
      <button id="btn-zoom-all">🔍 Zoom a todas</button>
      <button id="btn-hide-all">Ocultar todas</button>
      <button id="btn-show-all">Mostrar todas</button>
    </div>
    <details open>
      <summary><strong>Rutas</strong></summary>
      <details open>
        <summary><strong>Filtrar por dificultad</strong></summary>
        <label style="display:inline-flex;align-items:center;gap:6px;margin-right:10px;">
          <input type="checkbox" id="f-green" checked> Verde
        </label>
        <label style="display:inline-flex;align-items:center;gap:6px;margin-right:10px;">
          <input type="checkbox" id="f-blue" checked> Azul
        </label>
        <label style="display:inline-flex;align-items:center;gap:6px;">
          <input type="checkbox" id="f-black" checked> Negro
        </label>
        <details open>
  <summary><strong>Puntos</strong></summary>
  <div class="panel-row">
    <label style="display:flex;align-items:center;gap:6px;">
      <input type="checkbox" id="toggle-paramedics" checked> Paramédicos
    </label>
    <button id="zoom-paramedics">🔍</button>

    <label style="display:flex;align-items:center;gap:6px;margin-left:10px;">
      <input type="checkbox" id="toggle-checkpoints" checked> Checkpoints
    </label>
    <button id="zoom-checkpoints">🔍</button>
  </div>
</details>

</details>

      <div id="routes-list"></div>
    </details>
  </div>

  <!-- Librerías -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
   <script src="./libs/pmtiles.js"></script>
  <script src="./libs/openlocationcode.js"></script>
 

  <!-- App -->
  <script src="./app.js"></script>

  <!-- Service Worker (activar en producción) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' });
    }
  </script>
</body>
</html>
