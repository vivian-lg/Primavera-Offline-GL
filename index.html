<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Primavera Offline</title>

  <!-- MapLibre -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>

  <!-- Estilos -->
  <link rel="stylesheet" href="./styles.css"/>

  <!-- Favicon para evitar 404 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22>🗺️</text></svg>">
</head>
<body>
  <div id="status-badge" role="status" aria-live="polite">Listo</div>
  
  <!-- Barra superior -->
  <div id="topbar">
  <div class="track">
    <button id="btn-locate">📍 <span class="label">Mi ubicación</span></button>
    <button id="btn-follow">🧭 <span class="label">Seguirme: OFF</span></button>
    <button id="btn-navigate">➡️ <span class="label">Navegar a salida</span></button>
    <button id="btn-navigate-checkpoint">🏁 <span class="label">Checkpoint más cercano</span></button>
    <button id="btn-navigate-paramedic">🚑 <span class="label">Paramédico más cercano</span></button>

    <span class="chip">
      Plus Code: <b id="pluscode">—</b>
    </span>
  </div>
</div>


  <!-- Mapa -->
  <div id="map"></div>
  
  <!-- Botón flotante para mostrar/ocultar panel en móvil -->
  <button id="btn-panel" class="fab">☰ Capas</button>

  <!-- Guía (rumbo/distancia) -->
  <div id="guide" class="guide">—</div>

 <!-- Panel filtros -->
<div id="panel">
  <div class="panel-header" id="panel-header">
    <div class="panel-title">Filtros</div>
  </div>

 <!-- RUTAS -->
<div class="section" id="sec-rutas">
  <div class="section-head">
    <h3>Rutas</h3>
    <button class="section-toggle" data-target="sec-rutas" aria-expanded="true">▾</button>
  </div>

  <div class="section-body">
    <input id="search-routes" class="search" type="search" placeholder="Buscar ruta...">
    <div class="row" style="margin-top:8px;">
      <label><input type="checkbox" id="f-green" checked> Verde</label>
      <label><input type="checkbox" id="f-blue"  checked> Azul</label>
      <label><input type="checkbox" id="f-black" checked> Negro</label>
    </div>
    <div class="group-actions">
      <button id="btn-zoom-all">🔍 Zoom a todas</button>
      <button id="btn-hide-all">Ocultar todas</button>
      <button id="btn-show-all">Mostrar todas</button>
    </div>
    <div id="routes-list" class="list"></div>
  </div>
</div>

<!-- PARAMÉDICOS -->
<div class="section" id="sec-paramedicos">
  <div class="section-head">
    <h3>Paramédicos</h3>
    <button class="section-toggle" data-target="sec-paramedicos" aria-expanded="true">▾</button>
  </div>

  <div class="section-body">
    <input id="search-paramedics" class="search" type="search" placeholder="Buscar paramédico...">
    <div id="paramedics-list" class="list"></div>
    <div class="group-actions">
      <label><input type="checkbox" id="toggle-paramedics" checked> Mostrar capa</label>
      <button id="zoom-paramedics">🔍 Zoom paramédicos</button>
    </div>
  </div>
</div>

<!-- CHECKPOINTS -->
<div class="section" id="sec-checkpoints">
  <div class="section-head">
    <h3>Checkpoints</h3>
    <button class="section-toggle" data-target="sec-checkpoints" aria-expanded="true">▾</button>
  </div>

  <div class="section-body">
    <input id="search-checkpoints" class="search" type="search" placeholder="Buscar checkpoint...">
    <div id="checkpoints-list" class="list"></div>
    <div class="group-actions">
      <label><input type="checkbox" id="toggle-checkpoints" checked> Mostrar capa</label>
      <button id="zoom-checkpoints">🔍 Zoom checkpoints</button>
    </div>
  </div>
</div>


  <!-- Librerías -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
   <script src="./libs/pmtiles.js"></script>
  <script src="./libs/openlocationcode.js"></script>
 

  <!-- App -->
  <script src="./app.js"></script>

  <!-- Service Worker (activar en producción) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' });
    }
  </script>
</body>
</html>
